curacao {

  boot-package = "onyx"

  async-context-timeout = 1m

  thread-pool {
    size = 256
    name-format = "onyx-%d"
  }

  http {
    content-types {
      // The default map (curacao.util.http.ContentTypes) has no "md" or "xhtml" entry, so
      // those download as application/octet-stream instead of rendering, and none of its
      // entries carry a charset, so text goes out bare and browsers fall back to a locale
      // default (in practice ISO-8859-1) that renders UTF-8 as mojibake. Everything Onyx
      // stores is UTF-8, so say so here. This overrides a file's own <meta charset> or XML
      // declaration, so a file genuinely in another encoding breaks - fatally, for XML.
      // Values must be quoted; HOCON reads an unquoted ";" as a field separator.
      md = "text/plain; charset=utf-8"
      txt = "text/plain; charset=utf-8"
      csv = "text/csv; charset=utf-8"
      html = "text/html; charset=utf-8"
      htm = "text/html; charset=utf-8"
      xhtml = "application/xhtml+xml; charset=utf-8"
      xml = "application/xml; charset=utf-8"
      css = "text/css; charset=utf-8"
      js = "application/javascript; charset=utf-8"
      json = "application/json; charset=utf-8"
    }
  }

}

// Any Onyx config override values should be put into a ~/onyx-dev.conf file and loaded
// by passing a -Dconfig.file=/path/to/onyx-dev.conf system property on the command line.
// This practice is to explicitly avoid accidentally commiting credentials or access keys
// to source control within this shared/global application.conf file.
onyx {

  base-uri = "http://localhost:8080"
  context-path = "/onyx"

  dev-mode = false

}
